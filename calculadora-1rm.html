            const reader = ds.readable.getReader();

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>

: 500;    /* @kind font */\n  --fw-bold: 700;      /* @kind font */\n  --fw-black: 900;     /* @kind font */\n\n  /* ---- Type scale (display-forward) ---- */\n  --fs-display-2xl: 7rem;     /* 112px — hero billboards */\n  --fs-display-xl: 5rem;      /* 80px  — section titles */\n  --fs-display-lg: 3.5rem;    /* 56px  — big statements */\n  --fs-display-md: 2.75rem;   /* 44px  — sub-hero */\n  --fs-h1: 2.25rem;           /* 36px */\n  --fs-h2: 1.75rem;           /* 28px */\n  --fs-h3: 1.375rem;          /* 22px */\n  --fs-body-lg: 1.125rem;     /* 18px */\n  --fs-body: 1rem;            /* 16px */\n  --fs-body-sm: 0.875rem;     /* 14px */\n  --fs-caption: 0.75rem;      /* 12px */\n  --fs-kicker: 0.8125rem;     /* 13px — tracked label */\n\n  /* ---- Line heights ---- */\n  --lh-tight: 0.96;    /* @kind font */\n  --lh-snug: 1.1;      /* @kind font */\n  --lh-heading: 1.2;   /* @kind font */\n  --lh-body: 1.6;      /* @kind font */\n  --lh-relaxed: 1.75;  /* @kind font */\n\n  /* ---- Letter spacing ---- */\n  --ls-tight: -0.02em; /* @kind font */\n  --ls-snug: -0.01em;  /* @kind font */\n  --ls-normal: 0;      /* @kind font */\n  --ls-wide: 0.04em;   /* @kind font */\n  --ls-kicker: 0.22em; /* @kind font */\n  --ls-mega: 0.4em;    /* @kind font */\n}\n\n/* ============================================================\n   DC / Entrenamiento — Spacing, radii, shadows, motion, layout\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale (4px base) ---- */\n  --space-0: 0;\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n\n  /* ---- Radii ---- */\n  --radius-xs: 4px;\n  --radius-sm: 8px;\n  --radius-md: 12px;\n  --radius-lg: 16px;\n  --radius-xl: 22px;\n  --radius-2xl: 28px;\n  --radius-pill: 999px;       /* outlined badge pills */\n\n  /* ---- Borders ---- */\n  --border-width: 1px;\n  --border-width-strong: 2px;\n\n  /* ---- Elevation / shadows (tuned for dark canvas) ---- */\n  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);\n  --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.45);\n  --shadow-lg: 0 30px 80px rgba(0, 0, 0, 0.55);\n  --shadow-cover: 0 50px 120px rgba(0, 0, 0, 0.45), 0 16px 40px rgba(0, 0, 0, 0.30);\n  /* red glow — for primary CTA emphasis, used sparingly */\n  --shadow-accent: 0 8px 28px rgba(201, 17, 30, 0.40);\n  /* inner hairline for card edges on dark */\n  --ring-inset: inset 0 0 0 1px rgba(255, 255, 255, 0.06);\n\n  /* ---- The signature diagonal slash ---- */\n  --slash-skew: -16deg;       /* @kind other */\n\n  /* ---- Motion ---- */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);    /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --dur-fast: 140ms;   /* @kind other */\n  --dur-base: 240ms;   /* @kind other */\n  --dur-slow: 420ms;   /* @kind other */\n  --dur-reveal: 600ms; /* @kind other */\n\n  /* ---- Layout ---- */\n  --container-max: 1200px;\n  --container-wide: 1440px;\n  --gutter: clamp(20px, 5vw, 80px); /* @kind spacing */\n\n  /* ---- Backgrounds: subtle technical grid (use as background-image) ---- */\n  --grid-line: rgba(255, 255, 255, 0.04); /* @kind color */\n  --grid-size: 64px;  /* @kind spacing */\n}\n\n/* ============================================================\n   DC / Entrenamiento — Base layer & brand utility classes\n   Element defaults + reusable brand motifs (kicker, slash,\n   grid background, pills, surfaces). Built on the tokens.\n   ============================================================ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  font-weight: var(--fw-regular);\n  color: var(--text-primary);\n  background: var(--surface-base);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* ---- Headlines default to the display family, tight & bold ---- */\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-black);\n  line-height: var(--lh-heading);\n  letter-spacing: var(--ls-snug);\n  margin: 0;\n}\n\na { color: inherit; }\n\n/* ============================================================\n   Brand surfaces\n   ============================================================ */\n\n/* Dark canvas with the subtle technical grid texture */\n.dc-canvas {\n  background-color: var(--surface-base);\n  background-image:\n    linear-gradient(var(--grid-line) 1px, transparent 1px),\n    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);\n  background-size: var(--grid-size) var(--grid-size);\n}\n\n/* Light (\"cream\") inverse surface */\n.dc-surface-light {\n  background: var(--surface-light);\n  color: var(--text-on-light);\n}\n\n/* ============================================================\n   The signature diagonal slash (logo motif)\n   Use as a decorative accent bar; skews like the logo \"/\".\n   ============================================================ */\n.dc-slash {\n  display: inline-block;\n  width: 0.42em;\n  height: 1em;\n  background: var(--accent);\n  transform: skewX(var(--slash-skew));\n  border-radius: 2px;\n  flex-shrink: 0;\n}\n\n/* ============================================================\n   Kicker / eyebrow — red bar + tracked uppercase label\n   ============================================================ */\n.dc-kicker {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--space-4);\n}\n.dc-kicker::before {\n  content: \"\";\n  width: 40px;\n  height: 4px;\n  background: var(--accent);\n  transform: skewX(var(--slash-skew));\n  flex-shrink: 0;\n}\n.dc-kicker > span,\n.dc-kicker.dc-kicker--bare {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-kicker);\n  letter-spacing: var(--ls-kicker);\n  text-transform: uppercase;\n  color: var(--accent);\n  white-space: nowrap;\n}\n\n/* ============================================================\n   Outlined / filled badge pills (chapter numbers, tags)\n   ============================================================ */\n.dc-pill {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--space-2);\n  padding: 8px 20px;\n  border-radius: var(--radius-pill);\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-body-sm);\n  letter-spacing: var(--ls-wide);\n  border: var(--border-width-strong) solid var(--border-default);\n  color: var(--text-primary);\n}\n.dc-pill--accent {\n  background: var(--accent);\n  border-color: var(--accent);\n  color: var(--text-on-accent);\n}\n.dc-pill--outline-accent {\n  border-color: var(--accent);\n  color: var(--accent);\n}\n\n/* ============================================================\n   Focus visibility — brand red ring\n   ============================================================ */\n:where(button, a, input, select, textarea, [tabindex]):focus-visible {\n  outline: 2px solid var(--accent);\n  outline-offset: 2px;\n}\n\n<\u002Fstyle>\n  <script src=\"b25b3ac2-75d2-4e70-86ce-886f3b3b2579\"><\u002Fscript>\n  <style>\n    .dc-range{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;background:var(--surface-inset);outline:none;cursor:pointer}\n    .dc-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--dc-red);border:3px solid #fff;cursor:pointer;box-shadow:0 2px 7px rgba(0,0,0,.55)}\n    .dc-range::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--dc-red);border:3px solid #fff;cursor:pointer}\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"dc-canvas\" data-screen-label=\"Calculadora 1RM\" style=\"position:relative;min-height:100vh;overflow:hidden;padding:clamp(28px,4vw,56px);display:flex;flex-direction:column;gap:clamp(22px,2.6vw,30px);font-family:var(--font-body)\">\n\n  <div style=\"position:absolute;top:-15%;right:6%;width:130px;height:130%;background:var(--dc-red);opacity:0.06;transform:skewX(-16deg);pointer-events:none\"><\u002Fdiv>\n  <div style=\"position:absolute;top:-15%;right:12.5%;width:44px;height:130%;background:var(--dc-red);opacity:0.05;transform:skewX(-16deg);pointer-events:none\"><\u002Fdiv>\n  <div style=\"position:absolute;top:-15%;right:2%;width:18px;height:130%;background:var(--dc-red);opacity:0.05;transform:skewX(-16deg);pointer-events:none\"><\u002Fdiv>\n\n  <div style=\"position:relative;z-index:1;display:flex;flex-direction:column;gap:14px\">\n    <div class=\"dc-kicker\"><span>Calculadora · Ciencia aplicada<\u002Fspan><\u002Fdiv>\n    <h1 style=\"font-size:clamp(2.3rem,4.6vw,3.8rem);line-height:0.96;letter-spacing:-0.02em;text-transform:uppercase;margin:0;max-width:20ch\">Calculadora de <span style=\"color:var(--accent)\">1RM<\u002Fspan> y cargas de trabajo<\u002Fh1>\n    <p style=\"margin:0;max-width:66ch;color:var(--text-secondary);font-size:clamp(0.95rem,1.3vw,1.1rem);line-height:1.6\">Registra un esfuerzo conocido y calcula tu una repetición máxima estimada. Cambia el objetivo a <strong style=\"color:var(--text-primary);font-weight:700\">Hipertrofia<\u002Fstrong> para prescribir tus cargas de trabajo por repeticiones y nivel de esfuerzo (RPE / RIR).<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"position:relative;z-index:1;display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:clamp(20px,2.5vw,32px);align-items:start\">\n\n    <div style=\"display:flex;flex-direction:column;gap:18px;min-width:0\">\n\n      <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:16px;box-shadow:var(--shadow-md);overflow:hidden\">\n        <div style=\"height:5px;background:var(--dc-red);transform:skewX(-16deg);width:64px;margin:16px 0 -4px 20px;border-radius:2px\"><\u002Fdiv>\n        <div style=\"padding:18px 20px 22px;display:flex;flex-direction:column;gap:18px\">\n\n          <div style=\"display:flex;gap:6px;background:var(--surface-inset);padding:5px;border-radius:12px\">\n            <div onclick=\"{{ setEffort }}\" style=\"{{ effortTabStyle }}\">Desde esfuerzo<\u002Fdiv>\n            <div onclick=\"{{ set1rm }}\" style=\"{{ rmTabStyle }}\">Conozco mi 1RM<\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ isEffort }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;gap:18px\">\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\">\n                  <label style=\"font-family:var(--font-display);font-weight:500;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-secondary)\">Peso levantado<\u002Flabel>\n                  <div style=\"display:flex;gap:4px;background:var(--surface-inset);padding:4px;border-radius:9px\">\n                    <div onclick=\"{{ setKg }}\" style=\"{{ kgTabStyle }}\">kg<\u002Fdiv>\n                    <div onclick=\"{{ setLb }}\" style=\"{{ lbTabStyle }}\">lb<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"position:relative\">\n                  <input inputmode=\"decimal\" value=\"{{ weightStr }}\" onchange=\"{{ onWeight }}\" style=\"font-family:var(--font-display);font-weight:700;font-size:26px;color:var(--text-primary);background:var(--surface-inset);border:2px solid var(--border-default);border-radius:8px;padding:12px 52px 12px 14px;outline:none;width:100%\">\n                  <span style=\"position:absolute;right:16px;top:50%;transform:translateY(-50%);font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--text-muted);text-transform:uppercase\">{{ unit }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\">\n                  <label style=\"font-family:var(--font-display);font-weight:500;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-secondary)\">Repeticiones<\u002Flabel>\n                  <span style=\"font-family:var(--font-display);font-weight:900;font-size:22px;line-height:1;color:var(--accent)\">{{ reps }}<\u002Fspan>\n                <\u002Fdiv>\n                <input type=\"range\" class=\"dc-range\" min=\"1\" max=\"20\" step=\"1\" value=\"{{ reps }}\" onchange=\"{{ onReps }}\" style=\"{{ rangeStyle }}\">\n                <div style=\"display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)\"><span>1<\u002Fspan><span>20<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\">\n                  <label style=\"font-family:var(--font-display);font-weight:500;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-secondary)\">{{ intensityLabel }}<\u002Flabel>\n                  <div style=\"display:flex;gap:4px;background:var(--surface-inset);padding:4px;border-radius:9px\">\n                    <div onclick=\"{{ setRpeUnit }}\" style=\"{{ rpeUnitStyle }}\">RPE<\u002Fdiv>\n                    <div onclick=\"{{ setRirUnit }}\" style=\"{{ rirUnitStyle }}\">RIR<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                  <sc-for list=\"{{ rpeOptions }}\" as=\"opt\" hint-placeholder-count=\"9\">\n                    <div onclick=\"{{ opt.onClick }}\" style=\"{{ opt.style }}\">{{ opt.label }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ is1rm }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\">\n                <label style=\"font-family:var(--font-display);font-weight:500;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-secondary)\">Tu 1RM conocido<\u002Flabel>\n                <div style=\"display:flex;gap:4px;background:var(--surface-inset);padding:4px;border-radius:9px\">\n                  <div onclick=\"{{ setKg }}\" style=\"{{ kgTabStyle }}\">kg<\u002Fdiv>\n                  <div onclick=\"{{ setLb }}\" style=\"{{ lbTabStyle }}\">lb<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"position:relative\">\n                <input inputmode=\"decimal\" value=\"{{ oneRMStr }}\" onchange=\"{{ onOneRM }}\" style=\"font-family:var(--font-display);font-weight:700;font-size:26px;color:var(--text-primary);background:var(--surface-inset);border:2px solid var(--border-default);border-radius:8px;padding:12px 52px 12px 14px;outline:none;width:100%\">\n                <span style=\"position:absolute;right:16px;top:50%;transform:translateY(-50%);font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--text-muted);text-transform:uppercase\">{{ unit }}<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-size:12px;color:var(--text-muted);line-height:1.5\">Genera la tabla de cargas por RPE/RIR directamente desde tu máximo conocido.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display:flex;justify-content:flex-start\">\n            <x-import component-from-global-scope=\"DCEntrenamientoDesignSystem_49dc6b.Button\" variant=\"ghost\" size=\"sm\" on-click=\"{{ reset }}\" hint-size=\"auto,34px\">Reiniciar<\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"position:relative;background:var(--surface-raised);border:1px solid var(--border-subtle);border-radius:16px;padding:22px 24px;overflow:hidden;box-shadow:var(--shadow-sm)\">\n        <div style=\"position:absolute;right:-8px;top:-20%;width:72px;height:140%;background:var(--dc-red);opacity:0.09;transform:skewX(-16deg);pointer-events:none\"><\u002Fdiv>\n        <div class=\"dc-kicker\" style=\"margin-bottom:12px\"><span>1RM estimado<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:8px\">\n          <span style=\"font-family:var(--font-display);font-weight:900;font-size:clamp(3rem,7vw,4.6rem);line-height:0.88;letter-spacing:-0.03em;color:var(--text-primary)\">{{ oneRM }}<\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--accent);text-transform:uppercase\">{{ unit }}<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ isEffort }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"margin:12px 0 0;font-size:13px;color:var(--text-secondary);line-height:1.55\">{{ weightStr }} {{ unit }} × {{ reps }} reps @ RPE {{ rpe }} · {{ rir }} RIR — corresponde al <span style=\"color:var(--accent);font-weight:700\">{{ curPct }}%<\u002Fspan> de tu 1RM.<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:14px;min-width:0\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px\">\n        <div class=\"dc-kicker\"><span>Cargas objetivo · {{ unit }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:6px;background:var(--surface-inset);padding:5px;border-radius:12px\">\n          <div onclick=\"{{ setStrength }}\" style=\"{{ goalStrengthStyle }}\">Fuerza<\u002Fdiv>\n          <div onclick=\"{{ setHyp }}\" style=\"{{ goalHypStyle }}\">Hipertrofia<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-md)\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--border-subtle)\">\n          <span class=\"dc-slash\" style=\"height:0.9em\"><\u002Fspan>\n          <span style=\"font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-secondary)\">{{ tableSubtitle }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"overflow-x:auto\">\n          <div style=\"min-width:{{ gridMinWidth }}\">\n            <div style=\"display:flex;align-items:stretch\">\n              <div style=\"width:{{ labelWidth }};flex-shrink:0;display:flex;align-items:center;justify-content:flex-start;padding-left:12px;height:40px;font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:0.04em;color:var(--text-muted);border-right:1px solid var(--border-subtle);border-bottom:2px solid var(--border-default);text-transform:uppercase\">{{ cornerLabel }}<\u002Fdiv>\n              <sc-for list=\"{{ headerReps }}\" as=\"h\" hint-placeholder-count=\"10\">\n                <div style=\"{{ h.style }}\">{{ h.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-for list=\"{{ rows }}\" as=\"row\" hint-placeholder-count=\"8\">\n              <div style=\"display:flex;align-items:stretch\">\n                <div style=\"{{ row.labelStyle }}\">\n                  <span style=\"font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:0.02em\">{{ row.rpeLabel }}<\u002Fspan>\n                  <span style=\"font-family:var(--font-display);font-weight:700;font-size:10px;letter-spacing:0.06em;opacity:0.62;text-transform:uppercase;margin-top:2px\">{{ row.rirLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"10\">\n                  <div style=\"{{ cell.style }}\">{{ cell.load }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:12px;color:var(--text-muted);line-height:1.6;max-width:88ch\">RIR = repeticiones en reserva · RPE 10 = 0 RIR (esfuerzo máximo). Cada celda es la carga estimada para completar ese número de repeticiones a ese nivel de esfuerzo. Las cargas de repeticiones altas (&gt;12) son estimaciones y varían según el ejercicio; úsalas como punto de partida.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:relative;z-index:1;display:flex;align-items:center;gap:8px;color:var(--text-muted);font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:0.18em;text-transform:uppercase\">\n    <span class=\"dc-slash\" style=\"height:0.85em\"><\u002Fspan>DC · Entrenamiento — Ciencia aplicada al gimnasio\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:840},&quot;defaultUnit&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;kg&quot;,&quot;lb&quot;],&quot;default&quot;:&quot;kg&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Configuración&quot;},&quot;defaultGoal&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;strength&quot;,&quot;hypertrophy&quot;],&quot;default&quot;:&quot;strength&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Configuración&quot;},&quot;roundToPlates&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Configuración&quot;}}\">\nclass Component extends DCLogic {\n  state = { mode: \"effort\", goal: \"strength\", unit: \"kg\", effortUnit: \"rpe\", reps: 5, rpe: 8, weightStr: \"100\", oneRMStr: \"150\" };\n\n  // Tabla RPE/reps → fracción de 1RM. Índice n = reps + (10 - RPE), pasos de 0.5.\n  // n de 1.0 a 13.5 reconstruye EXACTAMENTE la hoja de cálculo original.\n  F = [1.0, 0.978448, 0.952586, 0.939655, 0.922414, 0.905172, 0.892241, 0.875,\n       0.862069, 0.849138, 0.836207, 0.823276, 0.810345, 0.797414, 0.784483,\n       0.771552, 0.762931, 0.75, 0.737069, 0.724138, 0.706897, 0.693966,\n       0.681034, 0.668103, 0.650862, 0.637931];\n\n  // Fracción de 1RM para (reps, rpe). Para n>13.5 (reps altas de hipertrofia)\n  // extiende la curva de forma continua con un modelo suave anclado en 13.5.\n  pctN(reps, rpe) {\n    const n = reps + (10 - rpe);\n    if (n <= 13.5) {\n      let i = Math.round((n - 1) / 0.5);\n      if (i < 0) i = 0;\n      if (i > this.F.length - 1) i = this.F.length - 1;\n      return this.F[i];\n    }\n    return 23.78 / (23.78 + n);\n  }\n\n  fmt(v) { return String(v); }\n\n  setUnit(u) {\n    const cur = this.state.unit || \"kg\";\n    if (u === cur) return;\n    const f = u === \"lb\" ? 2.20462 : 0.453592;\n    const cv = (str) => { const n = parseFloat(str); return n > 0 ? String(Math.round(n * f)) : str; };\n    this.setState({ unit: u, weightStr: cv(this.state.weightStr), oneRMStr: cv(this.state.oneRMStr) });\n  }\n\n  segStyle(active) {\n    return {\n      display: \"inline-flex\", alignItems: \"center\", justifyContent: \"center\",\n      minWidth: \"40px\", height: \"40px\", padding: \"0 8px\", borderRadius: \"999px\",\n      fontFamily: \"var(--font-display)\", fontWeight: \"700\", fontSize: \"15px\",\n      cursor: \"pointer\", userSelect: \"none\",\n      border: active ? \"2px solid var(--accent)\" : \"2px solid var(--border-default)\",\n      background: active ? \"var(--accent)\" : \"transparent\",\n      color: active ? \"#fff\" : \"var(--text-secondary)\",\n      transition: \"all 140ms ease\",\n    };\n  }\n\n  tabStyle(active) {\n    return {\n      flex: \"1\", textAlign: \"center\", padding: \"10px 8px\", borderRadius: \"8px\",\n      fontFamily: \"var(--font-display)\", fontWeight: \"700\", fontSize: \"13px\",\n      letterSpacing: \"0.03em\", textTransform: \"uppercase\", cursor: \"pointer\",\n      border: active ? \"2px solid var(--accent)\" : \"2px solid transparent\",\n      background: active ? \"rgba(201,17,30,0.12)\" : \"transparent\",\n      color: active ? \"var(--dc-red-bright)\" : \"var(--text-muted)\",\n      transition: \"all 140ms ease\",\n    };\n  }\n\n  miniTab(active) {\n    return {\n      padding: \"5px 12px\", borderRadius: \"7px\",\n      fontFamily: \"var(--font-display)\", fontWeight: \"700\", fontSize: \"12px\",\n      letterSpacing: \"0.04em\", textTransform: \"uppercase\", cursor: \"pointer\",\n      border: active ? \"2px solid var(--accent)\" : \"2px solid transparent\",\n      background: active ? \"rgba(201,17,30,0.14)\" : \"transparent\",\n      color: active ? \"var(--dc-red-bright)\" : \"var(--text-muted)\",\n      transition: \"all 140ms ease\",\n    };\n  }\n\n  headerCellStyle(active) {\n    return {\n      display: \"flex\", alignItems: \"center\", justifyContent: \"center\",\n      flex: \"1 0 0\", minWidth: \"48px\", height: \"40px\",\n      fontFamily: \"var(--font-display)\", fontWeight: \"700\", fontSize: \"13px\",\n      letterSpacing: \"0.02em\",\n      color: active ? \"var(--dc-red-bright)\" : \"var(--text-muted)\",\n      borderRight: \"1px solid var(--border-subtle)\",\n      borderBottom: \"2px solid var(--border-default)\",\n    };\n  }\n\n  rowLabelStyle(active, width) {\n    return {\n      width: width + \"px\", flexShrink: 0, display: \"flex\", flexDirection: \"column\",\n      alignItems: \"flex-start\", justifyContent: \"center\", paddingLeft: \"12px\", height: \"46px\",\n      textTransform: \"uppercase\",\n      color: active ? \"var(--dc-red-bright)\" : \"var(--text-muted)\",\n      borderRight: \"1px solid var(--border-subtle)\",\n      borderBottom: \"1px solid var(--border-subtle)\",\n    };\n  }\n\n  cellStyle(current, sameRow) {\n    return {\n      display: \"flex\", alignItems: \"center\", justifyContent: \"center\",\n      flex: \"1 0 0\", minWidth: \"48px\", height: \"46px\",\n      fontFamily: \"var(--font-body)\", fontSize: \"15px\",\n      fontWeight: current ? \"800\" : \"500\",\n      color: current ? \"#fff\" : (sameRow ? \"var(--text-primary)\" : \"var(--text-secondary)\"),\n      background: current ? \"var(--accent)\" : (sameRow ? \"rgba(201,17,30,0.07)\" : \"transparent\"),\n      borderRight: \"1px solid var(--border-subtle)\",\n      borderBottom: \"1px solid var(--border-subtle)\",\n      transition: \"background 140ms ease\",\n    };\n  }\n\n  renderVals() {\n    const s = this.state;\n    const mode = s.mode || \"effort\";\n    const goal = s.goal || this.props.defaultGoal || \"strength\";\n    const unit = s.unit || this.props.defaultUnit || \"kg\";\n    const effortUnit = s.effortUnit || \"rpe\";\n    const reps = s.reps || 5;\n    const rpe = s.rpe != null ? s.rpe : 8;\n    const weightStr = s.weightStr != null ? s.weightStr : \"\";\n    const oneRMStr = s.oneRMStr != null ? s.oneRMStr : \"\";\n\n    const roundPlates = !!this.props.roundToPlates;\n    const inc = unit === \"kg\" ? 2.5 : 5;\n    const roundLoad = (v) => roundPlates ? Math.round(v / inc) * inc : Math.round(v);\n\n    let oneRM = 0;\n    if (mode === \"effort\") {\n      const w = parseFloat(weightStr);\n      if (w > 0) oneRM = Math.round(w / this.pctN(reps, rpe));\n    } else {\n      const d = parseFloat(oneRMStr);\n      if (d > 0) oneRM = Math.round(d);\n    }\n    const curPct = Math.round(this.pctN(reps, rpe) * 100);\n    const rir = 10 - rpe;\n\n    const fillPct = ((reps - 1) / 19) * 100;\n    const rangeStyle = { background: \"linear-gradient(90deg, var(--dc-red) \" + fillPct + \"%, var(--surface-inset) \" + fillPct + \"%)\" };\n\n    const rpeVals = [6, 6.5, 7, 7.5, 8, 8.5, 9, 9.5, 10];\n    const rpeOptions = rpeVals.map((v) => {\n      const active = v === rpe;\n      const label = effortUnit === \"rpe\" ? this.fmt(v) : this.fmt(10 - v);\n      return { label, active, style: this.segStyle(active), onClick: () => this.setState({ rpe: v }) };\n    });\n\n    let rpeRows, repCols, labelW;\n    if (goal === \"hypertrophy\") {\n      rpeRows = [10, 9, 8, 7, 6];\n      repCols = []; for (let r = 6; r <= 20; r++) repCols.push(r);\n      labelW = 96;\n    } else {\n      rpeRows = [10, 9.5, 9, 8.5, 8, 7.5, 7, 6.5];\n      repCols = []; for (let r = 1; r <= 10; r++) repCols.push(r);\n      labelW = 88;\n    }\n\n    const headerReps = repCols.map((r) => ({ label: String(r), style: this.headerCellStyle(mode === \"effort\" && r === reps) }));\n\n    const rows = rpeRows.map((rv) => {\n      const active = mode === \"effort\" && rv === rpe;\n      const cells = repCols.map((r) => {\n        const load = oneRM > 0 ? roundLoad(oneRM * this.pctN(r, rv)) : 0;\n        const current = mode === \"effort\" && rv === rpe && r === reps;\n        const sameRow = mode === \"effort\" && rv === rpe;\n        return { load: load > 0 ? String(load) : \"—\", style: this.cellStyle(current, sameRow) };\n      });\n      return { rpeLabel: \"RPE \" + this.fmt(rv), rirLabel: this.fmt(10 - rv) + \" RIR\", labelStyle: this.rowLabelStyle(active, labelW), cells };\n    });\n\n    return {\n      isEffort: mode === \"effort\", is1rm: mode === \"1rm\",\n      weightStr, oneRMStr, unit,\n      reps, rpe: this.fmt(rpe), rir: this.fmt(rir),\n      oneRM: oneRM > 0 ? String(oneRM) : \"—\", curPct: String(curPct),\n      intensityLabel: effortUnit === \"rpe\" ? \"Intensidad · RPE\" : \"Intensidad · RIR\",\n      rangeStyle,\n      effortTabStyle: this.tabStyle(mode === \"effort\"), rmTabStyle: this.tabStyle(mode === \"1rm\"),\n      kgTabStyle: this.miniTab(unit === \"kg\"), lbTabStyle: this.miniTab(unit === \"lb\"),\n      rpeUnitStyle: this.miniTab(effortUnit === \"rpe\"), rirUnitStyle: this.miniTab(effortUnit === \"rir\"),\n      goalStrengthStyle: this.tabStyle(goal === \"strength\"), goalHypStyle: this.tabStyle(goal === \"hypertrophy\"),\n      rpeOptions, headerReps, rows,\n      cornerLabel: goal === \"hypertrophy\" ? \"RPE · RIR / Rep\" : \"RPE / Rep\",\n      gridMinWidth: (labelW + repCols.length * 54) + \"px\",\n      labelWidth: labelW + \"px\",\n      tableSubtitle: goal === \"hypertrophy\" ? \"Hipertrofia · 6–20 reps · RIR 0–4\" : \"Fuerza · 1–10 reps · RPE 6.5–10\",\n      setEffort: () => this.setState({ mode: \"effort\" }),\n      set1rm: () => this.setState({ mode: \"1rm\" }),\n      setStrength: () => this.setState({ goal: \"strength\" }),\n      setHyp: () => this.setState({ goal: \"hypertrophy\" }),\n      setRpeUnit: () => this.setState({ effortUnit: \"rpe\" }),\n      setRirUnit: () => this.setState({ effortUnit: \"rir\" }),\n      setKg: () => this.setUnit(\"kg\"),\n      setLb: () => this.setUnit(\"lb\"),\n      onReps: (e) => this.setState({ reps: parseInt(e.target.value, 10) || 1 }),\n      onWeight: (e) => this.setState({ weightStr: e.target.value.replace(/[^0-9.]/g, \"\") }),\n      onOneRM: (e) => this.setState({ oneRMStr: e.target.value.replace(/[^0-9.]/g, \"\") }),\n      reset: () => this.setState({ mode: \"effort\", reps: 5, rpe: 8, weightStr: (this.state.unit || \"kg\") === \"kg\" ? \"100\" : \"220\" }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
